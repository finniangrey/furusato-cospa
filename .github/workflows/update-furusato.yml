name: Update furusato data

# 毎日 JST 03:23 に返礼品データ（価格・在庫・レビュー）を取得し、main に commit する。
# Cloudflare Pages は main への push を検知して自動で再ビルド・デプロイする。
#
# Secrets（Settings > Secrets and variables > Actions）:
#   RAKUTEN_APP_ID / RAKUTEN_AFFILIATE_ID / RAKUTEN_ACCESS_KEY（任意）
#   YAHOO_CLIENT_ID / YAHOO_AFFILIATE_ID（任意）
# どれも未設定の間は、サンプルデータを生成するフォールバックモードで動く。
on:
  schedule:
    - cron: "23 18 * * *" # UTC 18:23 = JST 03:23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-furusato
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parser self-test
        run: python scripts/fetch_furusato.py --self-test

      - name: Fetch furusato data
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_AFFILIATE_ID: ${{ secrets.YAHOO_AFFILIATE_ID }}
        run: python scripts/fetch_furusato.py

      - name: Setup Node (build check)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/furusato.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/furusato.json
          git commit -m "chore(data): update furusato $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
